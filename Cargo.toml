[package]
name = "uping"
version = "0.1.1"
edition = "2021"
description = "A tiny TOML-configured reverse proxy with automatic HTTP->HTTPS redirects, built on Cloudflare Pingora."
license = "Apache-2.0"
authors = ["tetuaoro <65575727+tetuaoro@users.noreply.github.com>"]
repository = "https://github.com/raonagos/uping"

[dependencies]
pingora = { version = "0.9", features = ["proxy", "openssl", "connection_filter"] }
pingora-limits = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# The TLS tests mint a throwaway self-signed certificate at run time.
openssl = "0.10"
