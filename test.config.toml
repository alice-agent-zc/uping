# Local test config (uses high ports so it runs without root).
[listen]
http  = "127.0.0.1:8088"
https = "127.0.0.1:8443"

# Generous but finite, so the smoke test exercises the limiter paths.
[limits]
per_ip_rps           = 300
per_ip_conns_per_sec = 100
max_body_bytes       = 10485760

[tls]
fallback_cert = true

[[server]]
domain   = "test.local"
pub_key  = "certs/test.local.crt"
priv_key = "certs/test.local.key"
upstream = "127.0.0.1:8080"
