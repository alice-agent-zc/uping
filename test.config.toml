# Local test config (uses high ports so it runs without root).
#
# uping creates its own CA and leaf under cert/internal/ on first start, so
# there is nothing to generate by hand: `cargo run -- test.config.toml`.
[listen]
ipv4  = "127.0.0.1"
http  = 8088
https = 8443

# Generous but finite, so the smoke test exercises the limiter paths.
[limits]
per_ip_rps           = 300
per_ip_conns_per_sec = 100
max_body_bytes       = 10485760

[tls]
fallback_cert = true

[internal]
domain   = "test.local"
ca_dir   = "cert/internal/ca"
cert_dir = "cert/internal"

[[server]]
domain   = "test.local"
keys     = "internal"
upstream = "127.0.0.1:8080"
