name: release

# A release is identified by its tag, so the run is named for the tag rather
# than for whatever commit subject happened to be merged. `github.event.inputs`
# is the form that stays empty instead of erroring when no dispatch ran.
run-name: release ${{ github.event.inputs.tag || github.ref_name }}

# A tag is the only thing that publishes, so the asset a user downloads is
# always the code the tag names. `workflow_dispatch` rebuilds an existing tag in
# place — that is the repair path for a runner or toolchain problem, and it is
# deliberate: it can replace a published asset.
#
# Asset layout:
#   uping-<target>.tar.gz         uping, config.toml.example, uping.8
#   uping-<target>.tar.gz.sha256  bare "<hash>  <file>" from sha256sum
#   uping_<version>_amd64.deb     system package (binary, unit, man, docs)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # pingora builds zlib-ng through cmake, and pingora-openssl vendors
      # OpenSSL (its `vendored` feature), which needs perl and the C toolchain
      # the runner already has. No system libssl headers are involved.
      - name: build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake perl

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: tests
        run: cargo test --locked --target "$TARGET"

      - name: build
        run: cargo build --release --locked --target "$TARGET"

      # An ELF that links but does not reach main is not a release. `--check`
      # is the cheapest proof it executes: it must print the config-loading
      # error for a path that does not exist.
      - name: the binary runs
        run: |
          out=$(./target/"$TARGET"/release/uping --check /nonexistent.toml 2>&1 || true)
          printf '%s\n' "$out"
          case $out in
            *"loading configuration"*) ;;
            *) echo "the binary did not reach config loading" >&2; exit 1 ;;
          esac

      - name: package
        run: |
          mkdir -p dist
          cp target/"$TARGET"/release/uping dist/uping
          strip dist/uping
          cp config.toml.example dist/config.toml.example
          cp debian/uping.8 dist/uping.8
          # tar -C dist writes the archive beside the workflow's cwd, so the
          # checksum is taken there too.
          tar -C dist -czf "uping-$TARGET.tar.gz" \
            uping config.toml.example uping.8
          sha256sum "uping-$TARGET.tar.gz" > "uping-$TARGET.tar.gz.sha256"
          ls -l uping-"$TARGET".tar.gz*
          cat uping-"$TARGET".tar.gz.sha256

      # Same binary the tarball carries, packaged for dpkg. The runner is the
      # glibc baseline the package targets; CONTRIBUTING has the container
      # command that builds the same way locally.
      - name: package the .deb
        run: |
          cargo install cargo-deb --version 3.8.0
          cargo deb --no-build --target "$TARGET"
          dpkg-deb -I target/debian/uping_*.deb

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "uping $TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            uping-"$TARGET".tar.gz uping-"$TARGET".tar.gz.sha256 \
            target/debian/uping_*.deb
