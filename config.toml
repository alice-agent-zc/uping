# uping v0.3 — example configuration
#
# Run:    uping config.toml
# Check:  uping --check config.toml
# Reload: systemctl --user reload uping     (SIGHUP, no restart)
# Restart only after installing a new binary, or after changing [listen],
# a server's listen/listen6, or [[stream]].
#
# Every relative path (certificates, static roots, cert_dir) is resolved from
# the directory that holds this file.

# Optional. The host-wide listeners. One address per family, one port per
# protocol. There is no wildcard and no list: a domain that needs another
# address or port overrides it with `listen` / `listen6` below.
# [listen]
# ipv4  = "0.0.0.0"                # default
# ipv6  = ""                       # e.g. "2607:f1c0:f031:4500::1"; empty = off
# http  = 80                       # default
# https = 443                      # default

# Optional. Let's Encrypt, used by keys = "auto".
# [acme]
# email             = "ops@example.com"
# staging           = false
# cert_dir          = "cert"        # <this file's directory>/cert/<domain>/
# renew_before_days = 30            # clamped to 1..=89
# directory         = ""            # another ACME directory URL
# ca_bundle         = ""            # PEM root for a private ACME CA

# Optional. Abuse protection, counted per client IP over a 1-second window.
# Set any of them to 0 to switch that limit off.
# [limits]
# per_ip_rps          = 300        # requests/sec per IP, then 429
# per_ip_conns_per_sec = 100       # new TCP connections/sec per IP, then dropped
# max_body_bytes      = 10485760   # 10 MiB, then 413

# Optional. TLS behaviour.
# [tls]
# fallback_cert = true             # serve the first cert when SNI is absent/unknown

[[server]]
domain   = "www.example.com"
keys     = "auto"                 # default when no pub_key/priv_key are given
upstream = "127.0.0.1:8080"       # catch-all: every path without its own route

# Optional. Give this domain its own HTTPS listener instead of the global one.
# `listen` is IPv4, `listen6` is IPv6; each may carry a port, which defaults to
# `[listen] https`. HTTP stays host-wide: it is the redirect and the ACME
# challenge listener.
# listen  = "203.0.113.10"
# listen6 = "[2001:db8::10]:8443"

# A static site: no backend, just files. Exactly one of upstream/root.
#
# [[server]]
# domain = "static.example.com"
# keys   = "auto"
# root   = "public"               # relative to this file, or absolute
# index  = "index.html"

# Manual certificates: point at the two PEM files and renew them yourself.
#
# [[server]]
# domain   = "manual.example.com"
# keys     = "manual"
# pub_key  = "cert/manual.example.com/fullchain.pem"
# priv_key = "cert/manual.example.com/privkey.pem"
# upstream = "127.0.0.1:8080"

# Optional. One target per path prefix, nested under its server. The longest
# prefix wins, and a prefix only matches whole segments: /mcp covers /mcp and
# /mcp/sse, not /mcpx.
#
# [[server.route]]
# path     = "/mcp"
# upstream = "127.0.0.1:8081"
#
# [[server.route]]
# path         = "/assets"
# root         = "public/assets"
# strip_prefix = true            # /assets/app.css -> public/assets/app.css

# The map form names the domain in the table key; a route nested below it
# belongs to exactly that domain. Useful when one domain has several routes.
#
# [server."mcp.example.com"]
# upstream = "127.0.0.1:9000"
#
# [[server."mcp.example.com".route]]
# path     = "/sse"
# upstream = "127.0.0.1:9001"

# EXPERIMENTAL in v0.3. Raw TCP forwarding: one listener per entry, no TLS
# termination. `listen` is one concrete `IP:port`; an `upstream` must name a
# real peer.
#
# [[stream]]
# name     = "smtp"
# listen   = "0.0.0.0:25"
# upstream = "127.0.0.1:10025"
# connect_timeout_ms = 5000      # optional, default 5000, clamped 100..30000
