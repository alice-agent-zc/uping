# uping v0.1.1 — example configuration
#
# Run:  uping config.toml
#
# Plain HTTP requests are automatically redirected (301) to HTTPS.

# Optional. Defaults to 0.0.0.0:80 and 0.0.0.0:443.
# `*:port` is accepted as shorthand for `0.0.0.0:port`.
# [listen]
# http  = "*:80"
# https = "*:443"

# Optional. Abuse protection, counted per client IP over a 1-second window.
# Set any of them to 0 to switch that limit off.
# [limits]
# per_ip_rps          = 300        # requests/sec per IP, then 429
# per_ip_conns_per_sec = 100       # new TCP connections/sec per IP, then dropped
# max_body_bytes      = 10485760   # 10 MiB, then 413

# Optional. TLS behaviour.
# [tls]
# fallback_cert = true             # serve the first cert when SNI is absent/unknown

[[server]]
domain   = "www.example.com"
pub_key  = "certs/www.example.com/fullchain.pem"
priv_key = "certs/www.example.com/privkey.pem"
upstream = "127.0.0.1:8080"          # catch-all: every path without its own route

# Optional. One upstream per path prefix. The longest prefix wins, and a prefix
# only matches whole segments: /mcp covers /mcp and /mcp/sse, not /mcpx.
#
# [[server.route]]
# path     = "/mcp"
# upstream = "127.0.0.1:8081"
#
# [[server.route]]
# path         = "/assets/"
# upstream     = "127.0.0.1:8085"
# strip_prefix = true                # backend sees /app.css, not /assets/app.css

# Optional. One route for several domains at once. `hosts` empty (or ["*"])
# means every [[server]]; a named list must match configured domains.
# On an identical path the domain's own [[server.route]] wins.
#
# [[route]]
# path     = "/mcp"
# upstream = "127.0.0.1:8081"
# hosts    = ["www.example.com", "api.example.com"]   # optional

# Optional. Raw TCP forwarding: one listener per entry, no TLS termination
# (v0.2.0). `listen` accepts `*:port` as shorthand for `0.0.0.0:port`; an
# `upstream` must name a real peer.
#
# [[stream]]
# name     = "smtp"
# listen   = "*:25"
# upstream = "127.0.0.1:10025"
# connect_timeout_ms = 5000        # optional, default 5000, clamped 100..30000
